<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151517">
  <meta name="description" content="五位创业者的书单、荐语和访谈，每条阅读记录附出处。">
  <title>创业者书房 · Reading Room</title>
  <link rel="stylesheet" href="style.css?v=5">
  <script defer src="data.js"></script>
  <script defer src="app.js?v=4"></script>
</head>
<body>
  <header class="masthead shell">
    <a class="wordmark" href="#top"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Reading Room</a>
    <button class="quiet" id="about-button">收录说明 <span aria-hidden="true">↗</span></button>
  </header>
  <main id="top" class="shell">
    <div class="intro">
      <h1>创业者书房<span aria-hidden="true">.</span></h1>
      <p>五位创业者的书单、荐语与访谈。</p>
    </div>
    <section class="directory" aria-labelledby="people-heading">
      <div class="section-label"><h2 id="people-heading">人物</h2><span id="archive-count"></span></div>
      <div class="people-grid" id="people-grid"></div>
    </section>
    <section id="reading-room" aria-label="人物书房"></section>
    <footer>
      <span>Reading Room</span>
      <button class="quiet" id="credits-button">资料与图片署名 <span aria-hidden="true">↗</span></button>
    </footer>
  </main>
  <dialog id="info-dialog" aria-label="档案说明">
    <button class="dialog-close" aria-label="关闭">×</button>
    <div id="info-content"></div>
  </dialog>
  <dialog id="video-dialog" aria-label="访谈视频">
    <button class="dialog-close" aria-label="关闭视频">×</button>
    <div id="video-content"></div>
  </dialog>
</body>
</html>
